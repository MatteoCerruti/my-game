<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2048 - Puzzle Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
        }

        .container {
            text-align: center;
            padding: 40px 20px;
            max-width: 600px;
            width: 100%;
        }

        .game-icon {
            width: 200px;
            height: 200px;
            margin: 0 auto 30px;
            border-radius: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s ease;
        }

        .game-icon:hover {
            transform: scale(1.05);
        }

        h1 {
            font-size: 4rem;
            font-weight: 900;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #f5af19 0%, #f12711 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 4px 10px rgba(245, 175, 25, 0.3);
        }

        .subtitle {
            font-size: 1.2rem;
            color: #a8b2d1;
            margin-bottom: 40px;
        }

        .description {
            font-size: 1rem;
            color: #8892b0;
            line-height: 1.6;
            margin-bottom: 40px;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }

        .download-btn {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-decoration: none;
            padding: 18px 50px;
            border-radius: 50px;
            font-size: 1.2rem;
            font-weight: 600;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .download-btn:before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #764ba2 0%, #667eea 100%);
            transition: left 0.3s ease;
            z-index: -1;
        }

        .download-btn:hover:before {
            left: 0;
        }

        .download-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.6);
        }

        .google-play-badge {
            margin-top: 20px;
        }

        .google-play-badge img {
            height: 60px;
            transition: transform 0.3s ease;
        }

        .google-play-badge img:hover {
            transform: scale(1.05);
        }

        .features {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 50px;
            flex-wrap: wrap;
        }

        .feature {
            background: rgba(255, 255, 255, 0.05);
            padding: 20px 30px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .feature-icon {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .feature-text {
            font-size: 0.9rem;
            color: #a8b2d1;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 3rem;
            }

            .game-icon {
                width: 150px;
                height: 150px;
            }

            .download-btn {
                padding: 15px 40px;
                font-size: 1rem;
            }

            .features {
                flex-direction: column;
                gap: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="icon.png" alt="2048 Game Icon" class="game-icon">
        <h1>2048</h1>
        <p class="subtitle">Il puzzle game più avvincente</p>

        <p class="description">
            Unisci le tessere e raggiungi il 2048! Un gioco semplice ma coinvolgente 
            che metterà alla prova la tua strategia e capacità di pensiero.
        </p>

        <a href="https://play.google.com/store/apps/details?id=com.matteocerruti.duemilaquarantotto" 
           class="download-btn" 
           target="_blank">
            📱 Scarica Ora
        </a>

        <div class="google-play-badge">
            <a href="https://play.google.com/store/apps/details?id=com.matteocerruti.duemilaquarantotto" target="_blank">
                <img src="https://play.google.com/intl/en_us/badges/static/images/badges/it_badge_web_generic.png" 
                     alt="Disponibile su Google Play">
            </a>
        </div>

        <div style="margin-top: 40px; display: flex; gap: 30px; justify-content: center; flex-wrap: wrap;">
            <a href="privacy.html" 
            style="color: #a8b2d1; text-decoration: none; font-size: 0.9rem; transition: color 0.3s ease;"
            onmouseover="this.style.color='#667eea'"
            onmouseout="this.style.color='#a8b2d1'">
                🔒 Privacy Policy
            </a>
            <a href="delete-account.html" 
            style="color: #a8b2d1; text-decoration: none; font-size: 0.9rem; transition: color 0.3s ease;"
            onmouseover="this.style.color='#667eea'"
            onmouseout="this.style.color='#a8b2d1'">
                🗑️ Elimina Account
            </a>
        </div>

        <div class="features">
            <div class="feature">
                <div class="feature-icon">🎮</div>
                <div class="feature-text">Gameplay Classico</div>
            </div>
            <div class="feature">
                <div class="feature-icon">🏆</div>
                <div class="feature-text">Sfida i Tuoi Record</div>
            </div>
            <div class="feature">
                <div class="feature-icon">🎨</div>
                <div class="feature-text">Design Moderno</div>
            </div>
        </div>
    </div>
</body>
</html>
